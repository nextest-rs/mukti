[package]
name = "mukti-bin"
description = "Command to update release metadata"
version = "0.7.9"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
atomicwrites = "0.4.4"
blake2 = "0.10.6"
bytes = "1.11.1"
camino = "1.2.6"
clap = { version = "4.5.60", features = ["derive"] }
color-eyre = { version = "0.6.5", default-features = false }
flate2 = "1.1.9"
futures-util = "0.3.34"
mukti-metadata = { path = "../mukti-metadata" }
object = { version = "0.40.0", default-features = false, features = ["elf", "read_core", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "system-proxy"] }
semver = "1.0.28"
serde_json = "1.0.154"
sha2 = "0.10.9"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
camino-tempfile = "1.4.1"
hex-literal = "1.1.0"
httptest = "0.16.4"
insta = { version = "1.49.0", default-features = false }
object = { version = "0.40.0", default-features = false, features = ["elf", "write_std"] }
